services:
  app:
    build:
      context: .
      target: runtime
    container_name: kursi-generator-app
    ports:
      - "4323:4321"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4321/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
